# New camera device: this does not replace the existing water-meter pulse counter.
substitutions:
  device_name: waterwatch-camera
  friendly_name: WaterWatch Camera

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.1

esp32:
  board: esp32cam
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 40MHz
  ignore_not_found: false

logger:

api:
  encryption:
    key: !secret waterwatch_api_key

ota:
  - platform: esphome
    password: !secret waterwatch_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  - id: camera_i2c
    sda: GPIO26
    scl: GPIO27
    scan: false

esp32_camera:
  id: meter_camera
  name: Meter Camera
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_id: camera_i2c
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  resolution: 800x600
  jpeg_quality: 10
  max_framerate: 1 fps
  idle_framerate: 0.1 fps
  frame_buffer_count: 1
  frame_buffer_location: PSRAM
  aec_mode: auto
  agc_mode: auto
  wb_mode: auto

# Optional illumination: select this light in WaterWatch to flash for each capture.
# A separate diffuse light often gives a clearer image and less glare.
output:
  - platform: ledc
    id: flash_output
    pin: GPIO4
    channel: 2
    frequency: 1000 Hz

light:
  - platform: monochromatic
    id: meter_light
    name: Meter Illumination
    output: flash_output
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

sensor:
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
    update_interval: 60s

binary_sensor:
  - platform: status
    name: Camera Connection
