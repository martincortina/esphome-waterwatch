[project]
name = "waterwatch"
version = "0.14.4"
requires-python = ">=3.12"
description = "Local-first mechanical water meter camera and OCR service"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
