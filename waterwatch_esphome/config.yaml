name: WaterWatch ESPHome OCR
version: "0.3.0"
slug: waterwatch_esphome
description: Local optical water meter OCR using an ESPHome camera
arch:
  - amd64
  - aarch64
startup: application
boot: manual
stage: experimental
init: true
timeout: 240
ingress: true
ingress_port: 8099
panel_title: WaterWatch
panel_icon: mdi:water-check
panel_admin: true
homeassistant_api: true
services:
  - mqtt:want
backup: cold
options:
  publish_to_mqtt: false
  image_retention_days: 7
schema:
  publish_to_mqtt: bool
  image_retention_days: int(1,365)
url: https://github.com/martincortina/esphome-waterwatch
